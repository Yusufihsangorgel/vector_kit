name: vector_kit
description: "SIMD-accelerated vector math for embeddings: dot product, cosine similarity, normalization, and top-k search over packed matrices."
version: 1.4.0
repository: https://github.com/Yusufihsangorgel/vector_kit
issue_tracker: https://github.com/Yusufihsangorgel/vector_kit/issues
documentation: https://github.com/Yusufihsangorgel/vector_kit#readme
topics:
  - simd
  - vectors
  - embeddings
  - similarity
  - performance

# Single-line double-quoted on purpose. A folded (>-) block wraps at the line
# break and pub.dev renders the wrap point as a space, which split
# "milliseconds" into "millis econds" on the live page.
screenshots:
  - description: "Nanoseconds per 768-dimension dot product against scalar loops, and milliseconds per top-10 cosine query over 10,000 and 100,000 vectors."
    path: doc/bench.png
  - description: "Cost of one top-k search on the Dart VM, dart2js and dart2wasm, each measured against the same search written by hand on that target."
    path: doc/platform.png

environment:
  sdk: ^3.8.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
  # example/vector_kit_store.dart and its contract tests only. The adapter
  # implements rag_kit's VectorStore, which is why it cannot live in lib/
  # without making rag_kit a runtime dependency of every consumer.
  rag_kit: ^1.2.0
