name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        run: dart pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test
        run: dart test

      # The package advertises platform:web and is:wasm-ready. Until this step
      # existed nothing checked either, and a 63x web slowdown shipped unnoticed
      # (Float32x4 is emulated off native — see doc/web-performance.md).
      - name: Test on Chrome
        run: dart test -p chrome

      - name: Compile to wasm
        run: dart compile wasm example/semantic_search.dart -o /tmp/vk.wasm
