name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Weekly, so SDK, dependency and runner-image drift shows up on its
  # own rather than waiting for the next push.
  schedule:
    - cron: '33 6 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        run: dart pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test
        run: dart test

      # The package advertises platform:web and is:wasm-ready. Until these steps
      # existed nothing checked either, and a 15x (dart2js) to 41x (dart2wasm)
      # slowdown shipped unnoticed because Float32x4 is emulated off the VM.
      # Since 1.1.0 the kernels are platform-conditional, so these runs also
      # guard against the two paths drifting apart: cross_platform_test.dart
      # pins the exact top-k rows and fails if any target ranks differently.
      - name: Test on Chrome (dart2js)
        run: dart test -p chrome

      - name: Test on Chrome (dart2wasm)
        run: dart test -p chrome -c dart2wasm

      - name: Compile to wasm
        run: dart compile wasm example/semantic_search.dart -o /tmp/vk.wasm
